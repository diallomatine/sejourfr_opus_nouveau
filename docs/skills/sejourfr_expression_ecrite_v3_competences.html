const state={mode:'learn',view:'main',task:2,skill:0,micro:0,topic:0,filter:'all',skillFilter:'all',ref:'expected',selfEval:null};
const STORAGE_KEY='sejourfr_ee_skill_progress_v3';
let skillProgress=loadProgress();

function progressKey(task,skill,micro){return `${task}-${skill}-${micro}`}
function loadProgress(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(saved&&typeof saved==='object')return saved;
  }catch(e){}
  const seeded={};
  Object.entries(data).forEach(([task,t])=>t.skills.forEach((s,skill)=>{
    for(let micro=0;micro<s.done;micro++){
      const verdict=(micro+skill)%3===1?'partial':'validated';
      seeded[progressKey(task,skill,micro)]={done:true,verdict,attempts:micro%2?2:1,date:'5 août 2026',answer:'Exemple de production déjà enregistrée dans cette démonstration.',selfEval:micro%2?'unsure':'yes'};
    }
  }));
  return seeded;
}
function persistProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(skillProgress))}catch(e){}}
function getAttempt(task,skill,micro){return skillProgress[progressKey(task,skill,micro)]||null}
function getSkillStats(task,skill){
  const prompts=data[task].skills[skill].prompts;
  let done=0,validated=0,partial=0;
  prompts.forEach((_,micro)=>{const a=getAttempt(task,skill,micro);if(a?.done){done++;a.verdict==='validated'?validated++:partial++}});
  return {total:prompts.length,done,validated,partial,percent:Math.round(done/prompts.length*100)};
}
function getTaskStats(task){
  let total=0,done=0;data[task].skills.forEach((_,skill)=>{const x=getSkillStats(task,skill);total+=x.total;done+=x.done});
  return {total,done,percent:total?Math.round(done/total*100):0};
}
function saveAttempt(answer,verdict){
  const key=progressKey(state.task,state.skill,state.micro),old=skillProgress[key]||{};
  skillProgress[key]={done:true,verdict,attempts:(old.attempts||0)+1,date:'Aujourd’hui',answer,selfEval:state.selfEval||'unsure'};
  persistProgress();return skillProgress[key];
}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function nextUntreatedIndex(){
  const prompts=data[state.task].skills[state.skill].prompts;
  for(let offset=1;offset<=prompts.length;offset++){const i=(state.micro+offset)%prompts.length;if(!getAttempt(state.task,state.skill,i)?.done)return i}
  return (state.micro+1)%prompts.length;
}
const screen=document.getElementById('screen'),scroll=document.getElementById('scroll'),headerTitle=document.getElementById('headerTitle'),headerSub=document.getElementById('headerSub'),modeTabs=document.getElementById('modeTabs'),toast=document.getElementById('toast');

function taskPills(){return `<div class="task-pills">${[1,2,3].map(n=>`<button class="task-pill ${state.task===n?'active':''}" data-task="${n}"><span class="task-num">${n}</span>${data[n].name}</button>`).join('')}</div>`}
function setHeader(title,sub){headerTitle.textContent=title;headerSub.textContent=sub}
function hero(task,percent=42){return `<article class="hero"><div class="hero-top"><div><div class="eyebrow">Parcours TCF</div><h2>${task.hero}</h2><p>Travaille une compétence à la fois, puis utilise-la dans un sujet complet.</p></div><span class="level">${task.level}</span></div><div class="progress"><div class="progress-label"><span>Progression</span><span>${percent} %</span></div><div class="progress-line"><span style="width:${percent}%"></span></div></div></article>`}
function modeVisibility(show=true){modeTabs.classList.toggle('hidden',!show);document.querySelector('.bottom').classList.toggle('hidden',!show)}
function bindTaskPills(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{state.task=Number(b.dataset.task);state.filter='all';render()})}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1700)}
function scrollToStart(){scroll.scrollTo({top:0,behavior:'smooth'})}

function renderMainLearn(){
  const t=data[state.task],taskStats=getTaskStats(state.task);setHeader('Expression écrite','Compétences ciblées par tâche');modeVisibility(true);
  screen.innerHTML=`${hero(t,taskStats.percent)}<div class="section-head"><div><h3>Choisis une tâche</h3><p>Chaque tâche développe des compétences différentes.</p></div></div>${taskPills()}<div class="section-head"><div><h3>Compétences de la tâche ${state.task}</h3><p>Chaque compétence contient plusieurs petits sujets de production.</p></div><button class="link" id="resume">Continuer</button></div><div class="list">${t.skills.map((s,i)=>{const stats=getSkillStats(state.task,i);return `<article class="card skill-card" data-skill="${i}"><div class="icon">${icons[s.icon]}</div><div class="copy"><h4>${s.title}</h4><p>${s.desc}</p><div class="meta"><div class="mini"><span style="width:${stats.percent}%"></span></div><span class="count">${stats.done}/${stats.total} traités</span></div></div><div class="chev">›</div></article>`}).join('')}</div><div class="notice"><div class="notice-icon">i</div><div><strong>Principe pédagogique</strong><br>Le candidat produit directement. Chaque petit sujet travaille un seul critère attendu au TCF.</div></div>`;
  bindTaskPills();document.querySelectorAll('[data-skill]').forEach(c=>c.onclick=()=>{state.skill=Number(c.dataset.skill);state.skillFilter='all';state.view='skill';render()});document.getElementById('resume').onclick=()=>{const first=t.skills.findIndex((_,i)=>getSkillStats(state.task,i).done<getSkillStats(state.task,i).total);state.skill=first<0?0:first;state.skillFilter='all';state.view='skill';render()}
}
function renderSkill(){
  const t=data[state.task],s=t.skills[state.skill],stats=getSkillStats(state.task,state.skill);setHeader(s.title,`${s.prompts.length} petits sujets · Tâche ${state.task}`);modeVisibility(false);
  const filtered=s.prompts.map((p,i)=>({p,i,a:getAttempt(state.task,state.skill,i)})).filter(o=>state.skillFilter==='all'||(state.skillFilter==='done'?o.a?.done:!o.a?.done));
  screen.innerHTML=`<article class="card skill-summary"><div class="skill-summary-top"><div class="icon">${icons[s.icon]}</div><div><span class="badge level">${t.level}</span><h2>${s.title}</h2><p>${s.desc}</p></div></div><div class="criterion-box"><strong>Critère travaillé</strong><span>${s.criterion}</span></div><div class="meta"><div class="mini"><span style="width:${stats.percent}%"></span></div><span class="count">${stats.done}/${stats.total} traités</span></div></article><div class="section-head"><div><h3>Petits sujets</h3><p>Les sujets déjà réalisés restent clairement identifiables.</p></div><button class="reset-demo" id="resetDemo">Réinitialiser</button></div><div class="skill-filter-row"><button class="filter ${state.skillFilter==='all'?'active':''}" data-sfilter="all">Tous · ${stats.total}</button><button class="filter ${state.skillFilter==='todo'?'active':''}" data-sfilter="todo">À faire · ${stats.total-stats.done}</button><button class="filter ${state.skillFilter==='done'?'active':''}" data-sfilter="done">Traités · ${stats.done}</button></div><div class="list">${filtered.length?filtered.map(({p,i,a})=>`<article class="card micro-card ${a?.done?'done':''}" data-micro="${i}"><div class="micro-index">${a?.done?'✓':i+1}</div><div class="copy"><h4>${p[0]}</h4><p>${p[1]}</p>${a?.done?`<div class="attempt-meta"><span class="badge done">Traité</span><span class="badge ${a.verdict==='validated'?'validated':'reinforce'}">${a.verdict==='validated'?'Critère validé':'À renforcer'}</span><span class="attempt-date">${a.attempts} tentative${a.attempts>1?'s':''} · ${a.date}</span></div>`:''}</div><div class="micro-state">${a?.done?'':`<span class="badge todo">À faire</span>`}<div class="chev">›</div></div></article>`).join(''):`<div class="notice"><div class="notice-icon">✓</div><div><strong>Aucun sujet dans ce filtre</strong><br>Change de filtre pour afficher les autres petits sujets.</div></div>`}</div>`;
  document.querySelectorAll('[data-micro]').forEach(c=>c.onclick=()=>{state.micro=Number(c.dataset.micro);state.view='micro';state.ref='expected';state.selfEval=null;render()});
  document.querySelectorAll('[data-sfilter]').forEach(b=>b.onclick=()=>{state.skillFilter=b.dataset.sfilter;render()});
  document.getElementById('resetDemo').onclick=()=>{if(confirm('Réinitialiser la progression fictive de cette compétence ?')){s.prompts.forEach((_,i)=>delete skillProgress[progressKey(state.task,state.skill,i)]);persistProgress();render()}}
}
function refsFor(task,skill,micro){
  const title=data[task].skills[skill].prompts[micro][0];
  if(task===1)return {low:['Réponse insuffisante','« Je ne peux pas venir. »','La phrase répond partiellement, mais il manque la précision attendue.'],expected:['Réponse attendue','« Désolé, je ne pourrai pas venir samedi parce que je travaille. »','L’action demandée et la raison sont claires.'],great:['Excellente réponse','« Désolé, je ne pourrai malheureusement pas venir samedi, car je dois travailler jusqu’à 20 heures. »','La réponse reste simple, mais ajoute une précision utile.']};
  if(task===2)return {low:['Réponse insuffisante','« Je rate le train. »','Le temps et le contexte ne sont pas assez clairs.'],expected:['Réponse attendue','« Samedi dernier, j’ai raté mon train pour Lyon. »','Le moment et le fait principal sont immédiatement compréhensibles.'],great:['Excellente réponse','« Samedi dernier, je suis arrivé cinq minutes trop tard à la gare et j’ai raté mon train pour Lyon. »','La phrase ajoute une précision concrète sans devenir trop longue.']};
  return {low:['Réponse insuffisante','« La ville est bien. »','La position existe, mais elle reste vague et non argumentée.'],expected:['Réponse attendue','« Je préfère vivre en ville, car les transports et les services y sont plus accessibles. »','L’opinion et une justification sont clairement exprimées.'],great:['Excellente réponse','« À mon avis, vivre en ville est plus pratique, notamment grâce aux transports, aux commerces et aux services disponibles à proximité. »','La position est claire et l’argument est développé avec précision.']};
}
function renderExercise(kind){
  const t=data[state.task];let title,context,criterion,step,placeholder,max=kind==='micro'?420:900;
  let existing=null,s=null,p=null;
  if(kind==='micro'){
    s=t.skills[state.skill];p=s.prompts[state.micro];title=p[0];context=p[1];criterion=s.criterion;step=`Petit sujet ${state.micro+1}/${s.prompts.length}`;placeholder='Écrivez une réponse simple et précise…';existing=getAttempt(state.task,state.skill,state.micro)
  }else{
    p=t.topics[state.topic];title=p[0];context=p[1];criterion='Accomplir toute la tâche avec une réponse claire et adaptée.';step=`Tâche ${state.task} · ${t.range}`;placeholder=`Rédigez votre production (${t.range})…`
  }
  setHeader(title,kind==='micro'?s.title:`${t.subtitle} · ${t.range}`);modeVisibility(false);
  const stats=kind==='micro'?getSkillStats(state.task,state.skill):null;
  screen.innerHTML=`${kind==='micro'?`<div class="crumb"><b>Tâche ${state.task}</b><i>›</i><span>${s.title}</span><i>›</i><span>${title}</span></div><div class="exercise-progress"><div class="progress-label"><span>Progression de la compétence</span><span>${stats.done}/${stats.total}</span></div><div class="progress-line"><span style="width:${stats.percent}%"></span></div></div>${existing?`<div class="previous-attempt"><div class="previous-icon">✓</div><div><strong>Sujet déjà traité</strong><span>${existing.attempts} tentative${existing.attempts>1?'s':''} · ${existing.verdict==='validated'?'critère validé':'à renforcer'} · ${existing.date}</span></div><button id="reuseAnswer">Reprendre</button></div>`:''}`:''}<article class="exercise"><div class="exercise-top"><span class="criterion">${kind==='micro'?'Une compétence · un critère':'Sujet complet'}</span><span class="step">${step}</span></div><h2>${kind==='micro'?'Produis ta propre réponse.':'Rédige la tâche complète.'}</h2><p class="instruction">${kind==='micro'?'L’objectif n’est pas d’écrire une réponse parfaite, mais de montrer clairement la compétence travaillée.':'Réponds à tous les éléments de la consigne dans la longueur recommandée.'}</p><div class="objective-card"><div class="objective-label">◎ Compétence évaluée</div><p>${criterion}</p></div><div class="context"><strong>${kind==='micro'?'Petit sujet':'Sujet TCF'}</strong>${context}</div>${kind==='micro'?`<div class="requirements"><span class="requirement">✎ 1 à 3 phrases</span><span class="requirement">≃ 15 à 50 mots</span><span class="requirement">◎ Un seul critère</span></div><div class="why-box"><div class="why-icon">?</div><div><b>Pourquoi cet exercice ?</b><br>${s.desc} Cette compétence sera ensuite réutilisée dans une production TCF complète.</div></div>`:''}<div class="editor-head"><strong>Ta production</strong><span>${kind==='micro'?'Écris sans consulter les exemples':'Respecte la consigne complète'}</span></div><div class="editor"><textarea id="answer" maxlength="${max}" placeholder="${placeholder}"></textarea></div><div class="live-stats"><span><b id="words">0</b> mot(s)</span><span><b id="chars">0</b> caractère(s)</span></div>${kind==='micro'?`<div class="self-eval"><strong>Avant de comparer</strong><p>Penses-tu avoir respecté le critère annoncé ? Cette auto-évaluation n’influence pas la correction.</p><div class="self-options"><button class="self-option" data-self="yes">Oui</button><button class="self-option" data-self="unsure">Pas sûr</button><button class="self-option" data-self="no">Non</button></div></div>`:''}<div class="actions"><button class="primary" id="submit" disabled>${kind==='micro'?'Valider et comparer':'Envoyer pour correction'}</button><button class="secondary" id="clear">Effacer</button></div>${kind==='micro'?'<div class="tipline"><b>Important :</b><span>Les exemples de référence et l’analyse apparaissent seulement après ta production.</span></div>':''}</article><article class="result" id="result"></article>`;
  const answer=document.getElementById('answer'),submit=document.getElementById('submit');
  const updateCounter=()=>{const value=answer.value.trim();document.getElementById('chars').textContent=answer.value.length;document.getElementById('words').textContent=value?value.split(/\s+/).length:0;submit.disabled=value.length<(kind==='micro'?8:35)};
  answer.oninput=updateCounter;document.getElementById('clear').onclick=()=>{answer.value='';updateCounter();answer.focus()};submit.onclick=()=>showResult(kind,answer.value.trim());
  if(existing&&document.getElementById('reuseAnswer'))document.getElementById('reuseAnswer').onclick=()=>{answer.value=existing.answer||'';updateCounter();answer.focus();answer.scrollIntoView({behavior:'smooth',block:'center'})};
  document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{state.selfEval=b.dataset.self;document.querySelectorAll('[data-self]').forEach(x=>x.classList.toggle('active',x.dataset.self===state.selfEval))})
}
function showResult(kind,answerText){
  const result=document.getElementById('result');
  const submitButton=document.getElementById('submit'),clearButton=document.getElementById('clear'),answerField=document.getElementById('answer');
  if(submitButton){submitButton.disabled=true;submitButton.textContent='Production enregistrée'}
  if(clearButton)clearButton.disabled=true;
  if(answerField)answerField.readOnly=true;
  document.querySelectorAll('[data-self]').forEach(b=>b.disabled=true);
  if(kind==='micro'){
    const t=data[state.task],s=t.skills[state.skill],refs=refsFor(state.task,state.skill,state.micro),r=refs[state.ref];
    const words=answerText.split(/\s+/).filter(Boolean).length;
    const verdict=words>=8?'validated':'partial';
    const attempt=saveAttempt(answerText,verdict);
    const validated=verdict==='validated';
    const strength=state.task===1?'L’action demandée est identifiable dans ta réponse.':state.task===2?'Le lecteur comprend l’idée principale de ton récit.':'Ta position est identifiable dès la réponse.';
    const focus=state.task===1?'Ajoute seulement l’information précise demandée par la consigne.':state.task===2?'Ajoute un repère ou un détail concret pour mieux situer l’action.':'Explique ton avis avec une raison précise plutôt qu’une formule générale.';
    result.innerHTML=`<div class="result-title"><div class="check">✓</div><div><h3>Sujet marqué comme traité</h3><p>La progression de la compétence a été mise à jour.</p></div></div><div class="answer-box"><strong>Ta production</strong><p>${escapeHtml(answerText)}</p></div><div class="evaluation-card ${validated?'':'partial'}"><div class="evaluation-top"><strong>Critère unique</strong><span class="result-status ${validated?'validated':'partial'}">${validated?'✓ Globalement validé':'△ À renforcer'}</span></div><p>${validated?'Ta réponse montre la compétence attendue. Elle peut encore être améliorée, mais elle reste claire et exploitable pour le TCF.':'La réponse est compréhensible, mais le critère n’est pas encore assez visible. Une précision supplémentaire suffit souvent.'}</p></div><div class="feedback-grid"><div class="feedback-item good"><div class="feedback-icon">✓</div><div><strong>Point réussi</strong><p>${strength}</p></div></div><div class="feedback-item focus"><div class="feedback-icon">→</div><div><strong>Priorité pour progresser</strong><p>${focus}</p></div></div></div><div class="rewrite"><strong>Proposition améliorée</strong><p>${r[1]}</p><small>Exemple de reformulation : ce n’est pas la seule bonne réponse et l’idée du candidat doit être conservée.</small></div><h4 class="result-section-title">Compare avec les niveaux de référence</h4><div class="ref-tabs"><button class="ref-tab ${state.ref==='low'?'active':''}" data-ref="low">Insuffisant</button><button class="ref-tab ${state.ref==='expected'?'active':''}" data-ref="expected">Attendu</button><button class="ref-tab ${state.ref==='great'?'active':''}" data-ref="great">Très réussi</button></div><div class="ref-box"><strong id="refLabel">${r[0]}</strong><p id="refText">${r[1]}</p><small id="refNote">${r[2]}</small></div><div class="premium"><div class="spark">✦</div><div class="premium-copy"><strong>Analyse IA du critère</strong><span>Verdict simple, point réussi, priorité et reformulation courte.</span></div><button class="unlock" id="unlock">Voir</button></div><div class="ai" id="ai"><strong>Verdict :</strong> ${validated?'critère globalement validé':'critère partiellement validé'}.<br><strong>Point réussi :</strong> ${strength}<br><strong>À améliorer :</strong> ${focus}<br><strong>Conseil :</strong> retravaille uniquement ce point, sans chercher à corriger toute la langue en même temps.</div><div class="triple-actions"><button class="ghost" id="backList">Retour aux petits sujets</button><button class="ghost" id="retry">Refaire ce sujet</button><button class="solid wide" id="nextMicro">Sujet suivant à travailler</button></div>`;
    document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{state.ref=b.dataset.ref;const x=refs[state.ref];document.querySelectorAll('[data-ref]').forEach(y=>y.classList.toggle('active',y.dataset.ref===state.ref));document.getElementById('refLabel').textContent=x[0];document.getElementById('refText').textContent=x[1];document.getElementById('refNote').textContent=x[2]});
    document.getElementById('unlock').onclick=()=>{const ai=document.getElementById('ai');ai.classList.toggle('show');document.getElementById('unlock').textContent=ai.classList.contains('show')?'Masquer':'Voir'};
    document.getElementById('backList').onclick=()=>{state.view='skill';render()};
    document.getElementById('retry').onclick=()=>{state.selfEval=null;renderExercise('micro')};
    document.getElementById('nextMicro').onclick=()=>{state.micro=nextUntreatedIndex();state.selfEval=null;state.ref='expected';render()};
  }else{
    result.innerHTML=`<div class="result-title"><div class="check">✓</div><div><h3>Production envoyée</h3><p>Correction fictive du prototype.</p></div></div><div class="checks"><div class="check-line ok"><span class="dot"></span>La consigne principale est accomplie.</div><div class="check-line warn"><span class="dot"></span>Vérifie le développement et les connecteurs.</div></div><div class="criterion-box" style="margin-top:13px"><strong>Score estimé</strong><span><b>12,5/20</b> · Niveau estimé B1</span></div><div class="next-row"><button class="ghost" id="backTopics">Retour aux sujets</button><button class="solid" id="redo">Refaire</button></div>`;document.getElementById('backTopics').onclick=()=>{state.view='main';state.mode='topics';render()};document.getElementById('redo').onclick=()=>renderExercise('full')
  }
  result.classList.add('show');setTimeout(()=>result.scrollIntoView({behavior:'smooth',block:'start'}),80)
}
function renderTopics(){
  const t=data[state.task];setHeader('Sujets TCF',`${t.subtitle} · ${t.range}`);modeVisibility(true);const filtered=t.topics.map((x,i)=>({x,i})).filter(o=>state.filter==='all'||(state.filter==='done'?o.x[2]==='Fait':o.x[2]!=='Fait'));
  screen.innerHTML=`<article class="hero"><div class="hero-top"><div><div class="eyebrow">Entraînement libre</div><h2>${t.name} · ${t.range}</h2><p>Entraîne-toi sur plusieurs sujets complets de cette tâche, puis refais-les pour mesurer ta progression.</p></div><span class="level">${t.level}</span></div></article><div class="section-head"><div><h3>Choisis une tâche</h3><p>La liste des sujets change selon la tâche.</p></div></div>${taskPills()}<div class="section-head"><div><h3>${t.topics.length} sujets disponibles</h3><p>Données fictives, proches des situations TCF.</p></div></div><div class="filters"><button class="filter ${state.filter==='all'?'active':''}" data-filter="all">Tous · ${t.topics.length}</button><button class="filter ${state.filter==='todo'?'active':''}" data-filter="todo">À faire · ${t.topics.filter(x=>x[2]!=='Fait').length}</button><button class="filter ${state.filter==='done'?'active':''}" data-filter="done">Faits · ${t.topics.filter(x=>x[2]==='Fait').length}</button></div><div class="list">${filtered.map(({x,i})=>`<article class="card topic-card ${x[2]==='Fait'?'done':''}" data-topic="${i}"><div class="topic-num">${x[2]==='Fait'?'✓':i+1}</div><div class="copy"><h4>${x[0]}</h4><p>${x[1]}</p><div class="meta"><span class="badge ${x[2]==='Fait'?'done':'todo'}">${x[2]}</span>${x[3]?`<span class="badge score">${x[3]}</span>`:''}</div></div><div class="topic-actions"><button class="small-action">▶</button></div></article>`).join('')}</div>`;
  bindTaskPills();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-topic]').forEach(c=>c.onclick=()=>{state.topic=Number(c.dataset.topic);state.view='full';render()})
}
function renderSimulate(){
  setHeader('Examens blancs','Expression écrite complète');modeVisibility(true);screen.innerHTML=`<article class="hero"><div class="hero-top"><div><div class="eyebrow">Conditions proches du TCF</div><h2>Enchaîne les 3 tâches sans aide</h2><p>Chronomètre, compteurs de mots et correction globale à la fin.</p></div><span class="level">3 tâches</span></div></article><div class="section-head"><div><h3>Examens disponibles</h3><p>Chaque examen contient un message, un récit et une opinion.</p></div></div><div class="list">${[['Examen blanc 1','Non commencé','30 min'],['Examen blanc 2','À reprendre','18 min restantes'],['Examen blanc 3','Terminé','11,5/20']].map((e,i)=>`<article class="card exam-pack"><div class="exam-pack-top"><div><h4>${e[0]}</h4><p>3 sujets · difficulté progressive</p></div><span class="badge ${i===2?'done':i===1?'score':'todo'}">${e[1]}</span></div><div class="meta"><div class="mini"><span style="width:${i===2?100:i===1?43:0}%"></span></div><span class="count">${e[2]}</span></div><div class="pack-actions"><button class="outline" data-detail="${i}">Voir les tâches</button><button class="start" data-start="${i}">${i===1?'Continuer':'Commencer'}</button></div></article>`).join('')}</div>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>showToast('Ouverture de l’examen blanc'));document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showToast('3 tâches : message, récit, opinion'))
}
function render(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
  if(state.view==='skill')renderSkill();else if(state.view==='micro')renderExercise('micro');else if(state.view==='full')renderExercise('full');else if(state.mode==='learn')renderMainLearn();else if(state.mode==='topics')renderTopics();else renderSimulate();scrollToStart()
}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.view='main';render()});
document.getElementById('backBtn').onclick=()=>{if(state.view==='micro'){state.view='skill'}else if(state.view==='skill'){state.view='main';state.mode='learn'}else if(state.view==='full'){state.view='main';state.mode='topics'}else{showToast('Retour à l’accueil')}render()};
render();
</script>
</body></html>
