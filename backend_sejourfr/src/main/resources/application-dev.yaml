spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sejourfr_nouveau_2
    username: diallomatine
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        show_sql: false
  mail:
    # MailHog : serveur SMTP local sans auth, parfait pour le dev.
    # Installer avec brew (mac) : brew install mailhog && mailhog
    # Ou via docker  : docker run -p 1025:1025 -p 8025:8025 mailhog/mailhog
    # Puis ouvrir http://localhost:8025 pour voir les emails envoyés.
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  flyway:
    # En dev : on charge le schema commun puis le seed dev
    locations: classpath:db/migration,classpath:db/migration-dev

logging:
  level:
    com.sejourfr: DEBUG
    org.hibernate.SQL: OFF
    org.springframework.security: DEBUG

sejourfr:
  cors:
    # Web Next.js (3000) + Admin Vite (5173)
    allowed-origins: http://localhost:3000,http://localhost:5173,http://192.168.1.13:3000
  stripe:
    # Clés test Stripe : à définir DANS l'environnement (~/.zshrc ou .env
    # ignoré par git), JAMAIS en clair dans ce fichier — sinon GitHub
    # Push Protection bloque le commit.
    # https://dashboard.stripe.com/test/apikeys
    #
    # Mode abonnement récurrent (Checkout Session mode=SUBSCRIPTION) : les
    # Stripe Price IDs vivent en base sur plans.stripe_price_id depuis le
    # lot 4 — plus besoin de les déclarer ici. Côté Stripe Dashboard, créer
    # un Product par module (Civique / Intégral), avec 3 prix récurrents
    # (mensuel / trimestriel / annuel), puis UPDATE plans.stripe_price_id
    # avec les Price IDs correspondants (format price_xxx).
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
  apple:
    # App Store Server API + Notifications V2. Tant qu'un champ est vide,
    # les endpoints IAP Apple renvoient 503. Voir App Store Connect →
    # Users and Access → Integrations → App Store Server API pour générer
    # une clé (téléchargement P8 unique).
    issuer-id: ${APPLE_ISSUER_ID:}
    key-id: ${APPLE_KEY_ID:}
    # Contenu PEM du .p8, OU chemin vers le fichier .p8 (toléré en dev).
    private-key: ${APPLE_PRIVATE_KEY:}
    bundle-id: ${APPLE_BUNDLE_ID:}
    # Numérique, requis en production seulement (App Store Connect → App
    # Information → Apple ID). Laisse vide en sandbox.
    app-apple-id: ${APPLE_APP_ID:#{null}}
    # SANDBOX (TestFlight + builds locaux) | PRODUCTION (App Store).
    environment: ${APPLE_ENVIRONMENT:SANDBOX}
  google:
    # Play Developer API + Real-time Developer Notifications. Tant qu'un
    # champ est vide, les endpoints IAP Android renvoient 503. Service
    # Account JSON à générer dans Cloud Console → IAM → Service Accounts,
    # puis lier à Play Console (API access).
    service-account-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
    # URL publique exacte du webhook (= aud du JWT Pub/Sub).
    pub-sub-audience: ${GOOGLE_PUBSUB_AUDIENCE:}
    pub-sub-service-account-email: ${GOOGLE_PUBSUB_SA_EMAIL:}
  security:
    jwt:
      # Cle de signature (HS256) en BASE64. >= 32 octets.
      # En dev seulement. Pour la prod on lit ${JWT_SECRET}.
      secret: ZGV2LXNlY3JldC1ub24tcHJvZHVjdGlvbi1jbGUtc2lnbmF0dXJlLWp3dC1zZWpvdXJmci1tcXNkbWZkc2Y=
  storage:
    local:
      root: /Users/diallomatine/Desktop/Nouveu_Projets/sejour_storage
      public-base-url: http://192.168.1.1:8080/files
  mail:
    from: "no-reply@sejourfr.fr"
  app:
    # Utilisée pour générer le lien de reset password
    # En dev, on peut pointer sur l'admin web local
    base-url: "http://localhost:3000"

