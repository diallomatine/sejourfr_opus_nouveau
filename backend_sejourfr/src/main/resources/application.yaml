spring:
  application:
    name: sejourfr-backend
  profiles:
    # Defaut dev pour le confort local ; un deploiement DOIT poser
    # SPRING_PROFILES_ACTIVE=prod (les scripts de deploiement le font). Le
    # profil actif est logue au demarrage, avec un WARN si dev est actif
    # (cf. StartupProfileLogger) — garde-fou contre un deploiement prod
    # demarre par erreur en dev.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway gere le schema, JPA valide juste
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Arborescence par domaine sous db/migration (scan recursif par defaut) :
    #   00_schema (V001-V099) -> 100_reference (V100-V199)
    #   -> 200_civique (V200-V299) -> 400_tcf (V400-V799).
    # C'est le NUMERO de version qui ordonne l'execution, pas le dossier ;
    # les plages garantissent schema -> reference -> contenu.
    out-of-order: true
    # Tolere une migration retiree du code mais deja appliquee en base. Sans ca,
    # un env deploye AVANT un retrait echoue au boot sur "Detected applied
    # migration not resolved locally". N'affecte que les bases qui l'avaient
    # deja appliquee ; les bases neuves ne sont pas concernees.
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  servlet:
    context-path: /
  #error:
  #  include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

sejourfr:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://192.168.1.10:3000
  stripe:
    # Abonnements récurrents (Checkout Session mode=SUBSCRIPTION) depuis le
    # lot 4. Les Stripe Price IDs vivent en base sur plans.stripe_price_id —
    # ne pas les déclarer ici. Tant que secret-key est vide, /api/billing/*
    # renvoie 503 sur les flows payants.
    secret-key: ""
    webhook-secret: ""
    app-base-url: "http://localhost:3000"
  # --------------------------------------------------------------------------
  # Apple App Store Server (IAP iOS).
  # --------------------------------------------------------------------------
  # Tant qu'un champ est vide → endpoints IAP Apple renvoient 503.
  # Variables d'env (cf. .env dev / secrets prod) :
  #   APPLE_ISSUER_ID=99b16628-15e4-4668-972b-eeff55eeff55
  #   APPLE_KEY_ID=ABCDEFGHIJ
  #   APPLE_PRIVATE_KEY="-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
  #   APPLE_BUNDLE_ID=com.sejourfr.app
  #   APPLE_APP_ID=1234567890                # prod uniquement
  #   APPLE_ENVIRONMENT=SANDBOX              # ou PRODUCTION
  # Les root certs Apple doivent être présents dans src/main/resources/apple/
  # (AppleRootCA-G3.cer, AppleIncRootCertificate.cer, AppleComputerRootCertificate.cer).
  apple:
    issuer-id: ""
    key-id: ""
    private-key: ""
    bundle-id: ""
    app-apple-id: null
    environment: SANDBOX
    root-certs-classpath: "classpath:apple/*.cer"
    enable-online-checks: true
  # --------------------------------------------------------------------------
  # Google Play Billing (IAP Android).
  # --------------------------------------------------------------------------
  # Tant qu'un champ est vide → endpoints IAP Google renvoient 503.
  # Variables d'env :
  #   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON='{"type":"service_account",...}'
  #   GOOGLE_PLAY_PACKAGE_NAME=com.sejourfr.app
  #   GOOGLE_PUBSUB_AUDIENCE=https://api.sejourfr.fr/api/billing/webhooks/google
  #   GOOGLE_PUBSUB_SA_EMAIL=pubsub-pusher@<project>.iam.gserviceaccount.com
  google:
    service-account-json: ""
    package-name: ""
    pub-sub-audience: ""
    pub-sub-service-account-email: ""
  security:
    jwt:
      issuer: sejourfr-backend
      access-token-ttl-minutes: 60
      refresh-token-ttl-days: 30
  # --------------------------------------------------------------------------
  # OAuth / OIDC providers externes (Google web + Android, Apple iOS).
  # --------------------------------------------------------------------------
  # Tant qu'aucune audience n'est configuree, l'endpoint correspondant renvoie 503.
  # Configurer via .env (dev) ou variables d'env (prod) :
  #   GOOGLE_OAUTH_AUDIENCES=client-web.apps.googleusercontent.com,client-ios.apps.googleusercontent.com,client-android.apps.googleusercontent.com
  #   APPLE_OAUTH_AUDIENCES=com.sejourfr.app
  #   APPLE_TEAM_ID=ABCDE12345
  #
  # Google : l'audience presente dans le token est le client ID qui a demande
  # l'auth (web GIS, iOS google_sign_in, Android google_sign_in). Sur Android,
  # google_sign_in doit recevoir le "Web client ID" (server client id) en
  # `serverClientId` pour produire un id_token consommable cote backend —
  # c'est donc le client web qui finit dans l'audience.
  #
  # Apple : sur iOS natif, l'audience = Bundle ID. Si on ajoute le web plus
  # tard, ajouter le Services ID configure dans Apple Developer.
  oauth:
    google:
      audiences: ${GOOGLE_OAUTH_AUDIENCES:}
    apple:
      audiences: ${APPLE_OAUTH_AUDIENCES:}
      team-id: ${APPLE_TEAM_ID:}
  storage:
    # Implementation par defaut : disque local
    provider: local
    local:
      root: ./var/uploads
      public-base-url: http://192.168.1.1:8080/files
    max-file-size-bytes: 26214400
    allowed-image-types: image/png,image/jpeg,image/webp
    allowed-audio-types: audio/mpeg,audio/mp3,audio/ogg,audio/wav

  # Pipeline de generation de questions audio (TCF Comprehension Orale)
  # Cles API et secrets : exclusivement via variables d'environnement.
  # Tant qu'elles ne sont pas renseignees, l'endpoint /generate renverra 503.
  # En dev local : placer les vraies valeurs dans backend_sejourfr/.env
  # (gitignore), et lancer avec `source .env && ./mvnw spring-boot:run`.
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-4-7}
    api-url: https://api.anthropic.com/v1/messages
    anthropic-version: "2023-06-01"
    timeout-sec: 60
    max-retries: 2
    max-tokens: 4000
    prompt-version: ${ANTHROPIC_PROMPT_VERSION:v2}
  azure-speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:francecentral}
    output-format: audio-24khz-48kbitrate-mono-mp3
    timeout-sec: 30
    max-retries: 2
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:sejourfr-audio}
    public-url-base: ${R2_PUBLIC_URL_BASE:}
    timeout-sec: 30
  audio-generation:
    global-timeout-sec: ${AUDIO_GENERATION_TIMEOUT_SEC:120}
    rate-limit-per-minute: 10
    duplicate-similarity-threshold: 0.85

  # Rate-limit anti-abus (par IP / par utilisateur), applique en memoire.
  # Les seuils par surface ont des defauts genereux dans RateLimitProperties
  # (login, register, forgot/reset-password, contact, demo guest, soumissions
  # production EE/EO). Surcharge possible via sejourfr.rate-limit.<surface>.*.
  # RATE_LIMIT_ENABLED=false = soupape de secours (desactive tout le mecanisme).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

  # Pipeline d'evaluation des productions (EO/EE du TCF IRN).
  # Distinct de sejourfr.anthropic (qui sert a generer des questions audio CO).
  # Cles API exclusivement via variables d'environnement.
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-url: https://api.openai.com/v1/audio/transcriptions
    whisper:
      model: ${OPENAI_WHISPER_MODEL:whisper-1}
      language: fr
      timeout-sec: 60
      max-retries: 2
      retry-backoff-ms: 1000
      # Force la transcription "verbatim" : Whisper tend a auto-corriger les
      # fautes des apprenants ce qui rend l'evaluation trop indulgente.
      literal-mode-prompt: >
        Transcription litterale d'un apprenant de francais langue etrangere.
        Conserver les hesitations, les repetitions, et les eventuelles fautes
        grammaticales telles que prononcees.
  production-evaluation:
    # Provider LLM actif : openai (defaut), anthropic ou deepseek. Pour switcher,
    # changer cette valeur (ou EVAL_LLM_PROVIDER) et redemarrer le backend. Aucune
    # migration ni changement cote mobile : le DTO + le tool schema sont
    # identiques, seule la maniere d'appeler le LLM change.
    provider: ${EVAL_LLM_PROVIDER:openai}
    # Source UNIQUE de TOUTES les instructions d'eval (global + par tache) :
    # prompts/production-rubrics-<v>.json. Le system prompt et le user message
    # sont generes depuis ce fichier (plus de .md system/user-template).
    # prompt-version (ci-dessous) ne gouverne plus que le tool-schema (sortie).
    # Defaut v4.1 : v4 (criteres propres a chaque tache) + correction de
    # l'INDULGENCE mesuree au banc. Mesure sur golden-set-v1 (48 cas, DeepSeek) :
    # ecart global (reference - IA) -1,93 en v4 -> -1,0 en v4.1 ; notes dans la
    # fourchette 60 % -> 82-88 % ; A1 dans la fourchette 12 % -> 63 % ; A2 38 %
    # -> 92-100 % ; B2 inchange (85,7 % d'accord exact, ecart +0,5).
    # v3 et v4 restent charges et valides -> EVAL_RUBRICS_VERSION=v3|v4 suffit a
    # revenir en arriere (le banc de mesure bascule d'une version a l'autre avec
    # cette seule variable).
    rubrics-version: ${EVAL_RUBRICS_VERSION:v4.1}
    # Niveau CECRL CALCULE serveur (le niveau LLM est conserve en base pour
    # calibration mais jamais affiche). competence = moyenne(source-criteres) ;
    # seuils ajustables sans redeploiement. Plafond B2 (cible naturalisation).
    # source-criteres : marqueurs de langue/discours porteurs du niveau. La
    # coherence (organisation du discours) y est incluse — vraie dimension CECRL,
    # surtout a l'oral. La pertinence reste EXCLUE (completion de tache : un
    # debutant qui reussit une tache simple ne doit pas etre classe haut). Les
    # seuils restent cales (la coherence suit lexique/morpho dans les ancres
    # few-shot, decalage ~0,2 pt) ; recalibrer via le dashboard si besoin.
    niveau-cecrl:
      source-criteres: [ lexique, morphosyntaxe, coherence ]
      seuil-b2: 15.0
      seuil-b1: 12.0
      seuil-a2: 7.0
    # Controles DETERMINISTES executes AVANT l'appel LLM (aucune IA) :
    # langue dominante, recopiage de la consigne, production vide. Un verdict
    # INVALIDE court-circuite le LLM (note 0 / A1_NON_ATTEINT / confiance
    # FAIBLE) ; un AVERTISSEMENT laisse l'IA noter mais plafonne la confiance a
    # MOYENNE et expose ses raisons au candidat. Heuristiques => seuils
    # ajustables sans redeploiement.
    validite:
      min-mots-exploitables: 5
      mots-min-analyse-langue: 12
      ratio-mots-outils-invalide: 0.10
      ratio-mots-outils-avertissement: 0.18
      ratio-alphabet-non-latin-invalide: 0.30
      ngram-consigne: 5
      ratio-recopiage-avertissement: 0.30
      ratio-recopiage-invalide: 0.60
    # Plafonds de niveau appliques APRES le calcul du niveau par soumission.
    # Volontairement peu nombreux : uniquement ce qui est objectivable a partir
    # des criteres v4. enabled=false pour mesurer avec / sans.
    plafonds:
      enabled: ${EVAL_PLAFONDS_ENABLED:true}
      prise-position-seuil: 5.0
      prise-position-niveau-max: A2
      conduite-echange-seuil: 5.0
      conduite-echange-niveau-max: A2
    max-audio-duration-seconds: 300
    max-text-words: 300
    min-text-words: 10
    max-audio-size-bytes: 26214400
    cost-tracking-enabled: true
    max-retries-per-submission: 3
    presigned-url-expiry-minutes: 15
    openai:
      # Defaut : reutilise OPENAI_API_KEY (deja config pour Whisper). Surcharge
      # via EVAL_OPENAI_API_KEY si on veut une cle dediee.
      api-key: ${EVAL_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      api-url: https://api.openai.com/v1/chat/completions
      model: ${EVAL_OPENAI_MODEL:gpt-4o-mini}
      # 0 = notation déterministe (même texte → mêmes notes d'un run à l'autre).
      temperature: ${EVAL_OPENAI_TEMPERATURE:0}
      max-tokens: 2000
      timeout-sec: 60
      max-retries: 2
      retry-backoff-ms: 1000
      prompt-version: ${EVAL_PROMPT_VERSION:v2}
      # Tarification gpt-4o-mini (USD / 1M tokens, mai 2026). A surcharger si
      # on bascule sur gpt-4o ou gpt-5 (cout estime persiste dans ai_evaluations).
      cost-per-million-input-tokens: 0.15
      cost-per-million-output-tokens: 0.60
    anthropic:
      api-key: ${EVAL_ANTHROPIC_API_KEY:${ANTHROPIC_API_KEY:}}
      api-url: https://api.anthropic.com/v1/messages
      anthropic-version: "2023-06-01"
      model: ${EVAL_ANTHROPIC_MODEL:claude-sonnet-4-5}
      max-tokens: 2000
      timeout-sec: 60
      max-retries: 2
      retry-backoff-ms: 1000
      prompt-version: ${EVAL_PROMPT_VERSION:v2}
      cost-per-million-input-tokens: 3.0
      cost-per-million-output-tokens: 15.0
    # DeepSeek : API compatible OpenAI (meme client). Activer avec
    # EVAL_LLM_PROVIDER=deepseek + EVAL_DEEPSEEK_API_KEY (ou DEEPSEEK_API_KEY).
    deepseek:
      api-key: ${EVAL_DEEPSEEK_API_KEY:${DEEPSEEK_API_KEY:}}
      api-url: https://api.deepseek.com/chat/completions
      model: ${EVAL_DEEPSEEK_MODEL:deepseek-v4-flash}
      # DeepSeek V4 : thinking mode ON par défaut casse le tool_choice forcé (400).
      # On l'envoie {"thinking":{"type":"disabled"}} pour un tool_call déterministe.
      disable-thinking: ${EVAL_DEEPSEEK_DISABLE_THINKING:true}
      temperature: ${EVAL_DEEPSEEK_TEMPERATURE:0}
      max-tokens: 2000
      timeout-sec: 60
      prompt-version: ${EVAL_PROMPT_VERSION:v2}
      cost-per-million-input-tokens: 0.27
      cost-per-million-output-tokens: 1.10

  # Expression orale en TEMPS RÉEL (examinateur vocal IA, Tâches 1 & 2).
  # S'ajoute au pipeline async — ne le remplace pas. Schéma de connexion (A) :
  # le backend émet un token éphémère (persona verrouillée côté serveur), le
  # client ouvre lui-même le WebSocket vers le fournisseur. Si la clé n'est pas
  # renseignée, le mode bascule silencieusement en async (jamais bloquant).
  realtime:
    provider: ${REALTIME_PROVIDER:gemini}
    persona-version: v1
    gemini:
      # Clé Google AI (Gemini API). Absente -> temps réel désactivé (fallback async).
      api-key: ${GEMINI_API_KEY:}
      auth-tokens-url: https://generativelanguage.googleapis.com/v1alpha/auth_tokens
      # Token éphémère CONTRAINT -> endpoint "...Constrained" (sinon la system
      # instruction verrouillée + la transcription ne s'appliquent pas).
      ws-endpoint: wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained
      # ⚠️ Gamme native-audio en évolution : alias GA stable par défaut (le
      # preview ...-09-2025 est déprécié le 2026-03-19). À revérifier au build.
      # native-audio 2.5 = le moins cher, choix assumé. La transcription temps
      # réel devient propre côté CLIENT : fragments concaténés VERBATIM + ligne
      # émise seulement au turnComplete (pas d'espace ajouté, pas de nouvelle
      # ligne par flush) — c'est l'assemblage qui corrigeait « bon jour »/« 2 5 »,
      # pas le modèle.
      model: ${REALTIME_GEMINI_MODEL:gemini-live-2.5-flash-native-audio}
      voice: ${REALTIME_GEMINI_VOICE:Aoede}
      temperature: 0.7
      # VAD verrouillée dans le token (realtimeInputConfig.automaticActivityDetection).
      # Arbitrage patience ↔ réactivité : end-sensitivity LOW garde l'examinateur
      # tolérant aux pauses de réflexion (il ne coupe pas l'apprenant), tandis que
      # silence-duration-ms=500 (bas de la fourchette Google recommandée 500-800,
      # défaut serveur ~800) réduit ~de moitié l'attente contrôlable avant qu'il
      # réponde. start-sensitivity HIGH = détection rapide du début de parole. Ne
      # pas descendre silence-duration-ms sous ~500 (fragmenterait la parole).
      # Tunable sans redeploy via env (REALTIME_GEMINI_VAD_* si surchargé).
      vad:
        disabled: false
        start-sensitivity: START_SENSITIVITY_HIGH
        end-sensitivity: END_SENSITIVITY_LOW
        prefix-padding-ms: 300
        silence-duration-ms: 500
      token-uses: 1
      new-session-expire-seconds: 120
      session-expire-seconds: 1800
      timeout-sec: 15
    # Formats audio Gemini Live : entrée PCM 16 bits 16 kHz mono, sortie 24 kHz.
    audio:
      input-sample-rate: 16000
      input-mime-type: audio/pcm;rate=16000
      output-sample-rate: 24000
    # Le QUOTA de sessions par pass vit désormais en base (colonne
    # plans.realtime_eo_sessions, migrations V018/V113) — éditable côté admin,
    # « adapté selon le pass ». Plus de mapping en config ici.
