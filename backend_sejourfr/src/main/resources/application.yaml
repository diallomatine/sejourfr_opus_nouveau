spring:
  application:
    name: sejourfr-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway gere le schema, JPA valide juste
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Numerotation hybride V1-V99 (schema + features) + V200/V300/V400/V500
    # (lots civique). On accepte les migrations "manquantes" appliquees apres
    # une migration de numero superieur.
    out-of-order: true
    # Tolere une migration retiree du code mais deja appliquee en base (ex.
    # seed renomme/deplace, comme l'ancien V421 devenu V422). Sans ca, un env
    # deploye AVANT le retrait echoue au boot sur "Detected applied migration
    # not resolved locally". N'affecte que les bases qui l'avaient deja
    # appliquee (l'effet a deja eu lieu) ; les bases neuves ne sont pas
    # concernees. Evite la chirurgie SQL / flyway repair sur chaque env.
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  servlet:
    context-path: /
  #error:
  #  include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

sejourfr:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://192.168.1.36:3000
  stripe:
    # Abonnements récurrents (Checkout Session mode=SUBSCRIPTION) depuis le
    # lot 4. Les Stripe Price IDs vivent en base sur plans.stripe_price_id —
    # ne pas les déclarer ici. Tant que secret-key est vide, /api/billing/*
    # renvoie 503 sur les flows payants.
    secret-key: ""
    webhook-secret: ""
    app-base-url: "http://localhost:3000"
  # --------------------------------------------------------------------------
  # Apple App Store Server (IAP iOS).
  # --------------------------------------------------------------------------
  # Tant qu'un champ est vide → endpoints IAP Apple renvoient 503.
  # Variables d'env (cf. .env dev / secrets prod) :
  #   APPLE_ISSUER_ID=99b16628-15e4-4668-972b-eeff55eeff55
  #   APPLE_KEY_ID=ABCDEFGHIJ
  #   APPLE_PRIVATE_KEY="-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
  #   APPLE_BUNDLE_ID=com.sejourfr.app
  #   APPLE_APP_ID=1234567890                # prod uniquement
  #   APPLE_ENVIRONMENT=SANDBOX              # ou PRODUCTION
  # Les root certs Apple doivent être présents dans src/main/resources/apple/
  # (AppleRootCA-G3.cer, AppleIncRootCertificate.cer, AppleComputerRootCertificate.cer).
  apple:
    issuer-id: ""
    key-id: ""
    private-key: ""
    bundle-id: ""
    app-apple-id: null
    environment: SANDBOX
    root-certs-classpath: "classpath:apple/*.cer"
    enable-online-checks: true
  # --------------------------------------------------------------------------
  # Google Play Billing (IAP Android).
  # --------------------------------------------------------------------------
  # Tant qu'un champ est vide → endpoints IAP Google renvoient 503.
  # Variables d'env :
  #   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON='{"type":"service_account",...}'
  #   GOOGLE_PLAY_PACKAGE_NAME=com.sejourfr.app
  #   GOOGLE_PUBSUB_AUDIENCE=https://api.sejourfr.fr/api/billing/webhooks/google
  #   GOOGLE_PUBSUB_SA_EMAIL=pubsub-pusher@<project>.iam.gserviceaccount.com
  google:
    service-account-json: ""
    package-name: ""
    pub-sub-audience: ""
    pub-sub-service-account-email: ""
  security:
    jwt:
      issuer: sejourfr-backend
      access-token-ttl-minutes: 60
      refresh-token-ttl-days: 30
  # --------------------------------------------------------------------------
  # OAuth / OIDC providers externes (Google web + Android, Apple iOS).
  # --------------------------------------------------------------------------
  # Tant qu'aucune audience n'est configuree, l'endpoint correspondant renvoie 503.
  # Configurer via .env (dev) ou variables d'env (prod) :
  #   GOOGLE_OAUTH_AUDIENCES=client-web.apps.googleusercontent.com,client-ios.apps.googleusercontent.com,client-android.apps.googleusercontent.com
  #   APPLE_OAUTH_AUDIENCES=com.sejourfr.app
  #   APPLE_TEAM_ID=ABCDE12345
  #
  # Google : l'audience presente dans le token est le client ID qui a demande
  # l'auth (web GIS, iOS google_sign_in, Android google_sign_in). Sur Android,
  # google_sign_in doit recevoir le "Web client ID" (server client id) en
  # `serverClientId` pour produire un id_token consommable cote backend —
  # c'est donc le client web qui finit dans l'audience.
  #
  # Apple : sur iOS natif, l'audience = Bundle ID. Si on ajoute le web plus
  # tard, ajouter le Services ID configure dans Apple Developer.
  oauth:
    google:
      audiences: ${GOOGLE_OAUTH_AUDIENCES:}
    apple:
      audiences: ${APPLE_OAUTH_AUDIENCES:}
      team-id: ${APPLE_TEAM_ID:}
  storage:
    # Implementation par defaut : disque local
    provider: local
    local:
      root: ./var/uploads
      public-base-url: http://192.168.1.1:8080/files
    max-file-size-bytes: 26214400
    allowed-image-types: image/png,image/jpeg,image/webp
    allowed-audio-types: audio/mpeg,audio/mp3,audio/ogg,audio/wav

  # Pipeline de generation de questions audio (TCF Comprehension Orale)
  # Cles API et secrets : exclusivement via variables d'environnement.
  # Tant qu'elles ne sont pas renseignees, l'endpoint /generate renverra 503.
  # En dev local : placer les vraies valeurs dans backend_sejourfr/.env
  # (gitignore), et lancer avec `source .env && ./mvnw spring-boot:run`.
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-4-7}
    api-url: https://api.anthropic.com/v1/messages
    anthropic-version: "2023-06-01"
    timeout-sec: 60
    max-retries: 2
    max-tokens: 4000
    prompt-version: ${ANTHROPIC_PROMPT_VERSION:v2}
  azure-speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:francecentral}
    output-format: audio-24khz-48kbitrate-mono-mp3
    timeout-sec: 30
    max-retries: 2
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:sejourfr-audio}
    public-url-base: ${R2_PUBLIC_URL_BASE:}
    timeout-sec: 30
  audio-generation:
    global-timeout-sec: ${AUDIO_GENERATION_TIMEOUT_SEC:120}
    rate-limit-per-minute: 10
    duplicate-similarity-threshold: 0.85

  # Pipeline d'evaluation des productions (EO/EE du TCF IRN).
  # Distinct de sejourfr.anthropic (qui sert a generer des questions audio CO).
  # Cles API exclusivement via variables d'environnement.
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-url: https://api.openai.com/v1/audio/transcriptions
    whisper:
      model: ${OPENAI_WHISPER_MODEL:whisper-1}
      language: fr
      timeout-sec: 60
      max-retries: 2
      retry-backoff-ms: 1000
      # Force la transcription "verbatim" : Whisper tend a auto-corriger les
      # fautes des apprenants ce qui rend l'evaluation trop indulgente.
      literal-mode-prompt: >
        Transcription litterale d'un apprenant de francais langue etrangere.
        Conserver les hesitations, les repetitions, et les eventuelles fautes
        grammaticales telles que prononcees.
  production-evaluation:
    # Provider LLM actif : openai (defaut), anthropic ou deepseek. Pour switcher,
    # changer cette valeur (ou EVAL_LLM_PROVIDER) et redemarrer le backend. Aucune
    # migration ni changement cote mobile : le DTO + le tool schema sont
    # identiques, seule la maniere d'appeler le LLM change.
    provider: ${EVAL_LLM_PROVIDER:openai}
    # Source UNIQUE de TOUTES les instructions d'eval (global + par tache) :
    # prompts/production-rubrics-<v>.json. Le system prompt et le user message
    # sont generes depuis ce fichier (plus de .md system/user-template).
    # prompt-version (ci-dessous) ne gouverne plus que le tool-schema (sortie).
    rubrics-version: ${EVAL_RUBRICS_VERSION:v3}
    max-audio-duration-seconds: 300
    max-text-words: 300
    min-text-words: 10
    max-audio-size-bytes: 26214400
    cost-tracking-enabled: true
    max-retries-per-submission: 3
    presigned-url-expiry-minutes: 15
    openai:
      # Defaut : reutilise OPENAI_API_KEY (deja config pour Whisper). Surcharge
      # via EVAL_OPENAI_API_KEY si on veut une cle dediee.
      api-key: ${EVAL_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      api-url: https://api.openai.com/v1/chat/completions
      model: ${EVAL_OPENAI_MODEL:gpt-4o-mini}
      # 0 = notation déterministe (même texte → mêmes notes d'un run à l'autre).
      temperature: ${EVAL_OPENAI_TEMPERATURE:0}
      max-tokens: 2000
      timeout-sec: 60
      max-retries: 2
      retry-backoff-ms: 1000
      prompt-version: ${EVAL_PROMPT_VERSION:v1.5}
      # Tarification gpt-4o-mini (USD / 1M tokens, mai 2026). A surcharger si
      # on bascule sur gpt-4o ou gpt-5 (cout estime persiste dans ai_evaluations).
      cost-per-million-input-tokens: 0.15
      cost-per-million-output-tokens: 0.60
    anthropic:
      api-key: ${EVAL_ANTHROPIC_API_KEY:${ANTHROPIC_API_KEY:}}
      api-url: https://api.anthropic.com/v1/messages
      anthropic-version: "2023-06-01"
      model: ${EVAL_ANTHROPIC_MODEL:claude-sonnet-4-5}
      max-tokens: 2000
      timeout-sec: 60
      max-retries: 2
      retry-backoff-ms: 1000
      prompt-version: ${EVAL_PROMPT_VERSION:v1.5}
      cost-per-million-input-tokens: 3.0
      cost-per-million-output-tokens: 15.0
    # DeepSeek : API compatible OpenAI (meme client). Activer avec
    # EVAL_LLM_PROVIDER=deepseek + EVAL_DEEPSEEK_API_KEY (ou DEEPSEEK_API_KEY).
    deepseek:
      api-key: ${EVAL_DEEPSEEK_API_KEY:${DEEPSEEK_API_KEY:}}
      api-url: https://api.deepseek.com/chat/completions
      model: ${EVAL_DEEPSEEK_MODEL:deepseek-v4-flash}
      # DeepSeek V4 : thinking mode ON par défaut casse le tool_choice forcé (400).
      # On l'envoie {"thinking":{"type":"disabled"}} pour un tool_call déterministe.
      disable-thinking: ${EVAL_DEEPSEEK_DISABLE_THINKING:true}
      temperature: ${EVAL_DEEPSEEK_TEMPERATURE:0}
      max-tokens: 2000
      timeout-sec: 60
      prompt-version: ${EVAL_PROMPT_VERSION:v1.5}
      cost-per-million-input-tokens: 0.27
      cost-per-million-output-tokens: 1.10
