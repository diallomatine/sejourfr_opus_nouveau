<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#F4F6FC;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all;">{{preheader}}</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6FC;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #E4E7F2;">
          <tr>
            <td style="height:4px;background:#1E3A8C;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:24px 32px 18px;border-bottom:1px solid #EEF0F8;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align:middle;padding-right:12px;">
                    <img src="cid:logo" alt="SejourFR" width="38" height="38" style="display:block;border:0;border-radius:50%;"/>
                  </td>
                  <td style="vertical-align:middle;font-size:19px;font-weight:700;color:#0F1839;letter-spacing:-0.01em;">
                    Sejour<span style="color:#E1372F;">FR</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px;">
              <h1 style="margin:0 0 20px;font-size:22px;font-weight:700;color:#0F1839;letter-spacing:-0.015em;line-height:1.3;">{{title}}</h1>
              {{{body}}}
            </td>
          </tr>
          <tr>
            <td style="padding:22px 32px 28px;border-top:1px solid #EEF0F8;">
              <p style="margin:0;font-size:13px;color:#6B7299;line-height:1.5;">À bientôt,<br/>L'équipe SejourFR</p>
              <p style="margin:14px 0 0;font-size:12px;color:#9CA2BD;line-height:1.5;">
                Une question ? Écrivez-nous à <a href="mailto:{{supportEmail}}" style="color:#1E3A8C;text-decoration:none;">{{supportEmail}}</a>.<br/>
                Vous recevez cet email car votre compte SejourFR est rattaché à cette adresse.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:18px 0 0;font-size:11px;color:#9CA2BD;">© {{year}} SejourFR · Préparez vos examens civique &amp; TCF</p>
      </td>
    </tr>
  </table>
</body>
</html>
