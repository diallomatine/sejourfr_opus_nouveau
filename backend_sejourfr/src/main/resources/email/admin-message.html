<p style="margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#1E3A8C;">Message de l'équipe SejourFR</p>
<h1 style="margin:0 0 20px;font-size:22px;font-weight:700;color:#0F1839;letter-spacing:-0.015em;line-height:1.3;">{{subject}}</h1>
<p style="margin:0 0 16px;font-size:15px;color:#0F1839;line-height:1.6;">{{greeting}},</p>
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin:0 0 24px;border-radius:12px;background:#F4F6FC;border:1px solid #E4E7F2;border-left:4px solid #1E3A8C;">
  <tr>
    <td style="padding:16px 20px;">
      <p style="margin:0;font-size:15px;color:#0F1839;line-height:1.6;overflow-wrap:anywhere;word-break:break-word;">{{{messageHtml}}}</p>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:13px;color:#6B7299;line-height:1.6;">
  Une question ou une précision ? Répondez simplement à cet email : votre réponse arrive directement à notre équipe.
</p>
