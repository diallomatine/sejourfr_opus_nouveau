<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>{{title}} — SejourFR</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
           background: #FAFAF7; color: #0F1839; margin: 0;
           min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .card { background: white; border: 1px solid #E4E7F2; border-radius: 16px;
            padding: 32px 28px; max-width: 440px; width: 100%; box-sizing: border-box; text-align: center;
            box-shadow: 0 8px 24px rgba(15, 24, 57, 0.06); }
    h1 { font-size: 21px; margin: 0 0 10px; color: #1E3A8C; }
    p { font-size: 14px; line-height: 1.55; color: #6B7299; margin: 0 0 14px; }
    .message { color: #0F1839; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{title}}</h1>
    <p class="message">{{message}}</p>
    <p>{{detail}}</p>
  </div>
</body>
</html>
