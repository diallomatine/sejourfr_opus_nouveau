spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    properties:
      hibernate:
        show_sql: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_HOST}
          # Échec rapide si le SMTP est injoignable, plutôt qu'un hang qui
          # bloque le thread HTTP (contact, reset password).
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  flyway:
    # En prod : uniquement le schema commun, jamais le seed dev
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.sejourfr: INFO

server:
  forward-headers-strategy: framework

sejourfr:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  storage:
    local:
      root: ${STORAGE_LOCAL_ROOT:/var/sejourfr/uploads}
      public-base-url: ${STORAGE_PUBLIC_BASE_URL}
  mail:
    from: ${MAIL_FROM:no-reply@sejourfr.fr}
  app:
    base-url: ${APP_BASE_URL:https://sejourfr.fr}
  backend:
    # URL publique de l'API : le lien de confirmation de changement d'email pointe
    # vers le backend, pas vers le site.
    base-url: ${BACKEND_BASE_URL:https://api.sejourfr.fr}
  stripe:
    # Stripe Price IDs vivent en base (plans.stripe_price_id) — cf. lot 4.
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    app-base-url: ${APP_BASE_URL:https://sejourfr.fr}
  apple:
    issuer-id: ${APPLE_ISSUER_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    bundle-id: ${APPLE_BUNDLE_ID:}
    app-apple-id: ${APPLE_APP_ID:#{null}}
    environment: ${APPLE_ENVIRONMENT:PRODUCTION}
  google:
    service-account-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
    pub-sub-audience: ${GOOGLE_PUBSUB_AUDIENCE:}
    pub-sub-service-account-email: ${GOOGLE_PUBSUB_SA_EMAIL:}

