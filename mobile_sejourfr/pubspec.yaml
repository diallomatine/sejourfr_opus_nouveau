name: sejourfr_mobile
description: SejourFR — Préparation aux examens civique et TCF
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Stockage sécurisé tokens
  flutter_secure_storage: ^9.2.2

  # Typographie
  google_fonts: ^6.2.1

  # Médias TCF
  just_audio: ^0.9.42
  video_player: ^2.9.2
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.5.5
  flutter_launcher_icons: ^0.14.4

  # Ouverture de liens externes (page d'activation de l'accès sur le web)
  url_launcher: ^6.3.1

  # Social sign-in.
  # google_sign_in 6.x : API v2 (signIn() retourne un GoogleSignInAccount).
  # Pour avoir un idToken consommable cote backend, passer le Web client ID
  # en `serverClientId` au constructeur (cf. core/api/social_auth_repository.dart).
  google_sign_in: ^6.2.1
  # sign_in_with_apple 6.x : iOS uniquement (Android renvoie un identityToken
  # via le flow web Apple — non utilise ici).
  sign_in_with_apple: ^6.1.2

  # Expression orale TCF : capture audio + permissions micro + cache local.
  # Ajoutees au Lot A des fondations EO/EE mais consommees seulement au Lot B
  # (l'enregistrement audio user n'est pas encore branche).
  # record 6.x : record_linux 0.7.2 (livre avec 5.2.1) casse la compilation
  # Dart pour iOS car incompatible avec record_platform_interface 1.5.0.
  # La 6.x re-aligne tous les sous-packages (cf. issue record#475).
  record: ^6.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  # audio_session : indispensable sur iOS pour configurer AVAudioSession en
  # mode playAndRecord avant l'enregistrement (sinon `record` produit un
  # fichier silencieux quand just_audio a deja saisi la session en mode
  # playback). Deja transitif via just_audio, on l'expose explicitement.
  audio_session: ^0.1.21

  # Variables d'env runtime via fichier .env (style backend / web).
  # Cf. core/config/env.dart pour les accesseurs typés.
  flutter_dotenv: ^5.2.1

  # WebView pour les pages "statiques" longues (FAQ, CGU, Confidentialité).
  # On charge directement les pages web pour ne pas dupliquer 1200+ lignes
  # de contenu en Dart natif. AppBar native autour pour rester intégré.
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icones/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icones/logo_sejourFR.png"
  adaptive_icon_background: "#ffffff" # Couleur de fond (Android 8+)
  adaptive_icon_foreground: "assets/icones/logo_sejourFR.png"

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icones/
